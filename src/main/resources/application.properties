spring.application.name=library-management
# Hosting platforms (Render, Railway, ...) pass the port in $PORT
server.port=${PORT:8080}

# In-memory H2 database (swap for MySQL/PostgreSQL in production)
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Library rules
library.loan-period-days=14
library.max-active-loans-per-member=5
library.fine-per-day=0.50
