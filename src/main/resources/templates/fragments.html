<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · The Gilded Library'">The Gilded Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="nav(active)" class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">G</span>
        <span class="brand-name">The Gilded Library<small>Est. MMXXVI</small></span>
    </a>
    <nav>
        <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">Dashboard</a>
        <a th:href="@{/books}" th:classappend="${active == 'books'} ? 'active'">Collection</a>
        <a th:href="@{/members}" th:classappend="${active == 'members'} ? 'active'">Members</a>
        <a th:href="@{/loans}" th:classappend="${active == 'loans'} ? 'active'">Loans</a>
    </nav>
</header>

<div th:fragment="flash">
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
</div>

<span th:fragment="status(loan)" class="badge"
      th:classappend="${#strings.toLowerCase(loan.status)}" th:text="${loan.status}">ACTIVE</span>

<!-- Decorative cloth-bound cover; colour is picked from the book id -->
<div th:fragment="cover(book, size)" class="cover" th:classappend="'c' + ${book.id % 8} + ' ' + ${size}">
    <div>
        <div class="c-title" th:text="${book.title}">Title</div>
        <div class="c-orn"></div>
    </div>
    <div class="c-author" th:text="${book.author}">Author</div>
</div>

<footer th:fragment="footer" class="site">
    <span>✦</span> The Gilded Library <span>✦</span>
</footer>

</body>
</html>
